# ─── Velora WP Plugins SonarQube Configuration ───────────────────────────────
sonar.projectKey=velora-wp-plugins
sonar.projectName=Velora WP Plugins
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000

# Sources — PHP plugins + TypeScript core library
# breeder/ + club/ = PHP WordPress plugins (concrete implementations)
# shared/        = abstract PHP base classes (canonical source, used by both plugins)
# core/src/      = vanilla TypeScript widget library
sonar.sources=breeder,club,core/src,shared

# Exclusions — generated/build artefacts, WP.org metadata, and generated copies.
# IMPORTANT: make wp-plugins-build generates breeder/includes/class-base-*.php and
# club/includes/class-base-*.php from shared/class-base-*.php, rewriting the class
# names with a per-plugin prefix. Apart from those names the code is identical, so
# the generated files are excluded here — the canonical source lives in shared/ and
# is already included via the shared source root above.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/languages/**,\
  **/.wordpress-org/**,\
  **/test-pages/**,\
  **/*.d.ts,\
  **/admin/test-connection.js,\
  **/admin/test-connection.css,\
  **/blocks/editor.js,\
  breeder/includes/class-base-plugin.php,\
  breeder/includes/class-base-blocks.php,\
  breeder/includes/class-base-rest.php,\
  breeder/includes/class-base-updater.php,\
  club/includes/class-base-plugin.php,\
  club/includes/class-base-blocks.php,\
  club/includes/class-base-rest.php,\
  club/includes/class-base-updater.php,\
  core/src/__tests__/**,\
  breeder/velora-breeder-widgets.php,\
  club/velora-club-widgets.php

# Duplication exclusions — intentionally mirrored boilerplate between breeder/ and club/
# uninstall.php, view-settings.php: identical structural boilerplate by WP convention
# class-updater.php: ~80% identical — same updater pattern, different plugin slug only
# class-plugin.php: concrete implementations of abstract methods — PHP requires explicit
#   overrides for ALL abstract methods; structural similarity is unavoidable by design.
# class-blocks.php: Gutenberg BLOCKS data arrays — repeated type/default schema patterns.
# class-rest.php: 6 one-line abstract method overrides — trivially small, same pattern.
# core/src/i18n.ts: PL/EN translation dictionary — repetitive string data, not logic
# admin/test-connection.*: plugin-branding only, logic shared by JS not PHP
# blocks/editor.js: Gutenberg editor bundle — generated/different plugin slugs
sonar.cpd.exclusions=\
  **/uninstall.php,\
  **/view-settings.php,\
  **/class-updater.php,\
  **/class-plugin.php,\
  **/class-blocks.php,\
  **/class-rest.php,\
  core/src/i18n.ts,\
  core/src/widgets/**,\
  **/admin/test-connection.js,\
  **/admin/test-connection.css,\
  **/blocks/editor.js

# Coverage exclusions — non-logic files that inflate/skew metrics.
# Widget classes (about, events, gallery, etc.) are DOM-rendering components
# analogous to React components — they are tested via browser E2E, not unit tests.
# captcha.ts wraps Cap.js / reCAPTCHA — browser-only, can't run in jsdom.
# index.ts re-exports only — no executable logic to measure.
sonar.coverage.exclusions=\
  core/src/i18n.ts,\
  core/src/styles/**,\
  core/src/index.ts,\
  core/src/captcha.ts,\
  core/src/widgets/about.ts,\
  core/src/widgets/breeder-animals.ts,\
  core/src/widgets/breeder-contact.ts,\
  core/src/widgets/club-breeders.ts,\
  core/src/widgets/club-contact.ts,\
  core/src/widgets/club-documents.ts,\
  core/src/widgets/events.ts,\
  core/src/widgets/gallery.ts,\
  core/src/widgets/listings.ts,\
  core/src/widgets/posts.ts,\
  **/view-settings.php

# PHP coverage — Clover XML generated by make coverage-wp-plugins
sonar.php.coverage.reportPaths=tests/reports/clover.xml

# TypeScript coverage — LCOV generated by vitest --coverage
sonar.typescript.lcov.reportPaths=core/coverage/lcov.info

# ─── Issue Suppressions ───────────────────────────────────────────────────────
#
# php:S100 — function/method naming: WordPress coding standard mandates
#   snake_case for all hook callbacks, abstract method implementations, and
#   WP API calls (e.g. register_rest_route, add_action).  Renaming them to
#   camelCase would break plugin functionality.
#
# php:S101 — class naming: WordPress requires WP_Class_Style (underscores
#   allowed) for all plugin classes.  SonarQube's regex ^[A-Z][a-zA-Z0-9]*$
#   rejects the WP-mandated underscore separator (Velora_Base_Plugin, etc.).
#
# php:S1448 — too many methods: WP plugin architecture requires a single class
#   to implement the complete plugin lifecycle (activation, deactivation, hooks,
#   widgets, REST, settings, Gutenberg blocks).  Splitting it into smaller
#   classes would require multiple init() calls and break the WP plugin pattern.
sonar.issue.ignore.multicriteria=e1,e2,e3

sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.e2.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.php

# Encoding
sonar.sourceEncoding=UTF-8
