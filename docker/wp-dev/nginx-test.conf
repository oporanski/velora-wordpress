server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /embed/* serves the built core JS bundle (mounted from core/dist)
    location /embed/ {
        alias /srv/embed/;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Never cache HTML in dev
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
